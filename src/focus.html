<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Focus Mode</title>
  <link rel="stylesheet" href="styles/style.css" />
</head>

<body>
  <div class="app">

    <header class="header">
      <h1>Focus</h1>
      <button id="closeFocus" class="icon-btn">✕</button>
    </header>

    <section class="timer-section">
      <div class="progress-ring">
        <svg width="180" height="180">
          <circle class="ring-bg" cx="90" cy="90" r="80" />
          <circle class="ring-progress" cx="90" cy="90" r="80" />
        </svg>
        <div id="timer" class="timer">25:00</div>
      </div>

      <div class="mode">
        <span id="mode-work" class="active">Work</span>
        <span id="mode-break">Break</span>
      </div>
    </section>

    <section class="controls">
      <button id="pause" class="btn secondary">Pause</button>
      <button id="reset" class="btn secondary">Reset</button>
    </section>

  </div>

  <script src="scripts/popup.js"></script>
</body>
</html>
