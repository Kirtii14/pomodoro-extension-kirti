<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pomodoro Focus</title>
  <link rel="stylesheet" href="styles/style.css" />
</head>

<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <h1>Pomodoro</h1>
      <button id="themeToggle" class="icon-btn">🌙</button>
    </header>

    <!-- Timer -->
   <section class="timer-section">
  <div class="progress-ring">
    <svg width="180" height="180">
      <circle
        class="ring-bg"
        cx="90"
        cy="90"
        r="80"
      />
      <circle
        class="ring-progress"
        cx="90"
        cy="90"
        r="80"
      />
    </svg>

    <div id="timer" class="timer">25:00</div>
  </div>

  <div class="mode">
  <span id="mode-work" class="active">Work</span>
  <span id="mode-break">Break</span>
</div>

</section>


    <!-- Controls -->
    <section class="controls">
      <button id="start" class="btn primary">Start</button>
      <button id="pause" class="btn secondary">Pause</button>
      <button id="reset" class="btn secondary">Reset</button>
      <button id="focusMode" class="btn secondary">Focus Mode</button>
    </section>

    <!-- Settings preview -->
    <section class="settings">
      <div>
        <label>Work</label>
        <input id="workTime" type="number" value="25" min="1" />
      </div>
      <div>
        <label>Break</label>
        <input id="shortBreak" type="number" value="5" min="1" />
      </div>
      <div class="sound-controls">
        <label>
       <input type="checkbox" id="muteSound" /> Mute sound </label>

        <input id="volumeControl" type="range" min="0" max="1" step="0.1" value="0.6"/>
        </div>

    </section>

  </div>

  <script src="scripts/popup.js"></script>
  <script src="scripts/sound.js"></script>
  <script src="scripts/theme.js"></script>

</body>
</html>
